name: Run Notebooks

# Test on all pushes, except when the push is literally just a tag (because we
# tag automatically via CI, and therefore there's no extra code in that push).
# Also, only test on pull requests into master/dev.
on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - 'main'

jobs:
  notebooks:
    name: Running Docs Notebooks
    runs-on: ubuntu-latest
    env:
      # Keep UCX off the host's RDMA devices: on the Azure runners that expose a
      # MANA NIC, opening the verbs transport fails and aborts the interpreter
      # from C. Only shared-memory/loopback transports are ever needed here.
      UCX_TLS: self,sm,tcp
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1
      # No system MPI: the MPI runtime is pinned in uv.lock (the `mpich` entry in
      # the `test` dependency group) so every job runs an identical MPI stack.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: |
          uv sync --group doctests --locked

      - name: Install ipykernel
        run: uv run python -m ipykernel install --user --name matvis --display-name "matvis"

      - name: Run Notebooks
        run: |
          uv run papermill -k matvis docs/tutorials/matvis_tutorial.ipynb tmp.ipynb
